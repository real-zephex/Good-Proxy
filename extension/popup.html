<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        width: 240px;
        font: 13px/1.4 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      p {
        margin: 0 0 10px;
        color: #555;
        overflow-wrap: anywhere;
      }
      button {
        font: inherit;
        padding: 4px 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>GoodProxy</h1>
    <label><input type="checkbox" id="enabled" /> Enabled</label>
    <p id="target"></p>
    <button id="settings">Settings</button>
    <script src="popup.js"></script>
  </body>
</html>
